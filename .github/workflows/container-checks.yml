name: Validate container configuration

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "setup.linux.sh"
      - "promote_jetson.sh"
      - "fetch_bags.sh"
      - ".github/workflows/**"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          for script in setup.linux.sh promote_jetson.sh .devcontainer/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Prove docker stop reaches exec'd keepers
        run: .devcontainer/stop-test.sh ubuntu:24.04
      - name: Validate registry retention policy
        run: .github/scripts/test-registry-retention.py
      - name: Validate Jetson hardware gates
        run: python3 .github/scripts/test-jetson-validation.py
      - name: Validate local Jetson promotion
        run: python3 .github/scripts/test-jetson-promotion.py
      - name: Validate the clock stage
        run: .github/scripts/test-clock-stage.sh
      - name: Validate the DDS address choice
        run: .github/scripts/test-ros-net.sh
      - name: Validate the bag fetch fallback
        run: .github/scripts/test-fetch-bags.sh
      - name: Validate the boat revert
        run: if [ -f tests/test_boat_revert.sh ]; then bash tests/test_boat_revert.sh; fi
      - name: Check dependency locks, Compose and Jetson image policy
        run: .github/scripts/check-containers.py
      - name: Validate Compose adapters
        run: |
          for adapter in .devcontainer/docker-compose.override.*.yml; do
            docker compose \
              -f .devcontainer/docker-compose.yml \
              -f "$adapter" config --quiet
          done
      - name: Reject stale ROS and Gazebo Classic references
        run: |
          ! grep -RInE 'ros-humble|/opt/ros/humble|gazebo_ros_pkgs|gazebo_ros2_control' \
            .devcontainer .vscode generate_packages.py
      - uses: docker/setup-buildx-action@v3
      - name: Build core without publishing
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.dev
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=pr-core
          cache-to: type=gha,mode=max,scope=pr-core
