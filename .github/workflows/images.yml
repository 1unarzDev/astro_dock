name: Build container images

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      arm64_builder:
        description: Native ARM64 builder to use
        required: false
        default: hosted
        type: choice
        options:
          - hosted
          - self-hosted

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: lunarzdev/astro

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.dev
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:core-${{ matrix.arch }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=ros-jazzy
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}
      - name: Smoke-test core image
        run: |
          docker run --rm \
            "${REGISTRY_IMAGE}:core-${{ matrix.arch }}-${GITHUB_SHA}" \
            bash -lc 'test "$(id -un)" = roboboat && test "$(id -gn)" = roboboat && source /opt/ros/jazzy/setup.bash && ros2 pkg prefix ros_gz_bridge && sudo -n true'

  core-manifest:
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-architecture core tags
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:core-${GITHUB_SHA}" \
            --tag "${REGISTRY_IMAGE}:core" \
            "${REGISTRY_IMAGE}:core-amd64-${GITHUB_SHA}" \
            "${REGISTRY_IMAGE}:core-arm64-${GITHUB_SHA}"

  amd64-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cuda
            dockerfile: .devcontainer/Dockerfile.dev
            build_args: |
              BASE_IMAGE=stereolabs/zed:5.4.1-gl-devel-cuda12.8-ubuntu24.04@sha256:45a8c195b6aeece79f4660ef5c6ced3c449d8f1bb560f316f1a4d00d3ac3e90e
              ZED_WRAPPER_REF=v5.4.1
          - tag: sitl
            dockerfile: .devcontainer/Dockerfile.sitl
            build_args: |
              ARDUPILOT_REF=Rover-4.6.2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ matrix.tag }}-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
      - name: Smoke-test immutable image
        env:
          TAG: ${{ matrix.tag }}
        run: |
          if [ "$TAG" = cuda ]; then
            docker run --rm "${REGISTRY_IMAGE}:${TAG}-${GITHUB_SHA}" \
              bash -lc 'test "$(id -un)" = roboboat && test "$(id -gn)" = roboboat && source /opt/ros/jazzy/setup.bash && source /opt/zed_ros2/setup.bash && sudo -n true'
          else
            docker run --rm "${REGISTRY_IMAGE}:${TAG}-${GITHUB_SHA}" \
              bash -lc 'test -x ./build/sitl/bin/ardurover && sudo -n true'
          fi
      - name: Promote moving tag
        env:
          TAG: ${{ matrix.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${TAG}" \
            "${REGISTRY_IMAGE}:${TAG}-${GITHUB_SHA}"

  deps:
    runs-on: ${{ inputs.arm64_builder == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","arm64-builder"]') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build dependencies natively on ARM64
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.deps
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:deps-${{ github.sha }}
            ${{ env.REGISTRY_IMAGE }}:deps
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=ros-jazzy_zed-5.4.1_l4t-r36.4
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-deps
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-deps,mode=max

  jetson-candidate:
    needs: deps
    runs-on: ${{ inputs.arm64_builder == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","arm64-builder"]') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.jetson
          platforms: linux/arm64
          network: host
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:jetson-${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY_IMAGE }}:deps-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=ros-jazzy_zed-5.4.1_l4t-r36.4
          cache-from: type=gha,scope=jetson-final
          cache-to: type=gha,mode=max,scope=jetson-final
