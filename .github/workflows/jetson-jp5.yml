name: Build legacy JetPack 5 Foxy image
on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile.jetson-jp5'
      - '.devcontainer/jetson-jp5-packages.txt'
      - '.devcontainer/astro-ros-install.sh'
      - '.devcontainer/jetson-user.sh'
      - '.devcontainer/configure-zed-access.sh'
      - '.devcontainer/dev.helper.txt'
      - '.devcontainer/astro-camera-preview.py'
      - '.devcontainer/test-camera-preview.py'
      - '.github/workflows/jetson-jp5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jetson-jp5-foxy-build
  cancel-in-progress: false
jobs:
  legacy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: python3 .devcontainer/test-camera-preview.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.jetson-jp5
          platforms: linux/arm64
          push: true
          tags: lunarzdev/astro:jetson-jp5-foxy-next
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=jetson-jp5-foxy
          cache-to: type=gha,scope=jetson-jp5-foxy,mode=max
      - name: Check legacy runtime contract (GPU validation happens on host)
        run: |
          docker run --rm lunarzdev/astro:jetson-jp5-foxy-next bash -ic \
            'test "$(id -un)" = roboboat && sudo -n true && ros2 pkg prefix zed_wrapper && ros2 pkg prefix compressed_image_transport && astro-camera-preview --help && astro-ros-install --help'
      - name: Exercise shared package installer on Foxy
        run: |
          docker run --rm --user root lunarzdev/astro:jetson-jp5-foxy-next \
            astro-ros-install --source examples_rclcpp_minimal_publisher
