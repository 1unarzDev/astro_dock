name: Promote hardware-validated Jetson image
on:
  workflow_dispatch:
    inputs:
      family:
        type: choice
        required: true
        options: [jetson-jp5-foxy, jetson-jp6-jazzy]
      digest:
        description: 'Hardware-validated sha256 digest (not a mutable tag)'
        required: true
      validation:
        description: 'Host and successful GPU/camera validation notes'
        required: true
permissions:
  contents: read
concurrency:
  group: docker-hub-mutations
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Rotate the selected family only
        env:
          FAMILY: ${{ inputs.family }}
          DIGEST: ${{ inputs.digest }}
          VALIDATION: ${{ inputs.validation }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 2
          case "$FAMILY" in
            jetson-jp5-foxy) expected=5 ;;
            jetson-jp6-jazzy) expected=6 ;;
            *) exit 2 ;;
          esac
          image="lunarzdev/astro@${DIGEST}"
          labels="$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "$image")"
          jq -e --arg expected "$expected" '."org.astro.jetpack" == $expected' <<<"$labels"
          .devcontainer/registry-retention.py rotate "$FAMILY" "$image"
          printf 'Promoted %s at %s\n\n%s\n' "$FAMILY" "$DIGEST" "$VALIDATION" >> "$GITHUB_STEP_SUMMARY"
