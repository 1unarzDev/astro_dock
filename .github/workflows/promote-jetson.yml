name: Promote hardware-validated Jetson image
run-name: ${{ inputs.family }} promotion ${{ inputs.digest }}
on:
  workflow_dispatch:
    inputs:
      family:
        type: choice
        required: true
        options: [jetson-jp6-jazzy]
      run_id:
        description: 'Successful main-branch build run'
        required: true
      digest:
        description: 'Immutable digest validated by promote_jetson.sh'
        required: true
      validation:
        description: 'Successful local CUDA and live-camera validation output'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.family }}-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify build provenance and rotate the validated family
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ inputs.family }}
          RUN_ID: ${{ inputs.run_id }}
          DIGEST: ${{ inputs.digest }}
          VALIDATION: ${{ inputs.validation }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          candidate="$(.github/scripts/jetson-candidate.sh "$FAMILY" "$RUN_ID")"
          test "$(jq -r .digest <<<"$candidate")" = "$DIGEST"
          test -n "$VALIDATION"
          revision="$(jq -r .revision <<<"$candidate")"
          test "$FAMILY" = jetson-jp6-jazzy
          expected=6
          image="lunarzdev/astro@${DIGEST}"
          labels="$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "$image")"
          jq -e --arg expected "$expected" --arg revision "$revision" \
            '."org.astro.jetpack" == $expected and ."org.opencontainers.image.revision" == $revision' <<<"$labels"
          .github/scripts/registry-retention.py rotate "$FAMILY" "$image"
          printf 'Promoted %s at %s\n\n%s\n' "$FAMILY" "$DIGEST" "$VALIDATION" >> "$GITHUB_STEP_SUMMARY"
