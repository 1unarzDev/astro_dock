services:
  dev:
    image: ${ASTRO_IMAGE:-lunarzdev/astro:jetson-jp6-jazzy}
    # Boat computers run headless; keep the container up across reboots.
    restart: unless-stopped
    runtime: nvidia
    environment:
      ROS_DOMAIN_ID: ${ASTRO_ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      EGL_PLATFORM: surfaceless
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /tmp/argus_socket:/tmp/argus_socket
      - zed_resources:/usr/local/zed/resources
      - zed_settings:/usr/local/zed/settings
volumes:
  zed_resources:
  zed_settings:
