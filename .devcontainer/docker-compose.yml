services:
  dev:
    image: ${ASTRO_IMAGE:-lunarzdev/astro:core}
    # Dev Containers replaces this with a locally built UID-adjusted image.
    # "always" would make Compose incorrectly pull that vsc-* image from a registry.
    pull_policy: ${ASTRO_PULL_POLICY:-missing}
    container_name: roboboat_dev
    hostname: roboboat
    extra_hosts:
      - roboboat:127.0.1.1
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    shm_size: 2gb
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      ROS_DOMAIN_ID: "42"
      ROS_WS: /home/roboboat/roboboat_ws
    volumes:
      - ..:/home/roboboat/roboboat_ws
    user: roboboat
    working_dir: /home/roboboat/roboboat_ws
    command: sleep infinity

  # Viewer laptops: relays the boat lidar into RViz/Nav2's DDS graph and comes
  # back after reboots. Enable once with:
  #   cd .devcontainer && docker compose --profile viewer up -d --pull always lidar-relay
  lidar-relay:
    extends:
      service: dev
    profiles: ["viewer"]
    container_name: astro_lidar_relay
    volumes:
      - ..:/home/roboboat/roboboat_ws
    command: bash -lc 'source /opt/ros/jazzy/setup.bash && source install/setup.bash && exec install/lib/mhseals_nav/lidar_relay'
    restart: unless-stopped
  sitl:
    profiles: ["sitl"]
    image: ${ASTRO_SITL_IMAGE:-lunarzdev/astro:sitl}
    pull_policy: ${ASTRO_PULL_POLICY:-missing}
    platform: linux/amd64
    container_name: ardupilot_sitl
    hostname: ardupilot
    extra_hosts:
      - ardupilot:127.0.1.1
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      VEHICLE: Rover
      DISPLAY: ${DISPLAY:-}
      SITL_EXTRA_ARGS: --console --add-param-file=/param/boat.param --model JSON:127.0.0.1 --out tcp-l:5762
    volumes:
      - ./boat.param:/param/boat.param:rw
    restart: unless-stopped
