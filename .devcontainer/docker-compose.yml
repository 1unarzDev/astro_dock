services:
  dev:
    image: ${ASTRO_IMAGE:-lunarzdev/astro:core}
    # Dev Containers replaces this with a locally built UID-adjusted image.
    # "always" would make Compose incorrectly pull that vsc-* image from a registry.
    pull_policy: ${ASTRO_PULL_POLICY:-missing}
    container_name: roboboat_dev
    hostname: roboboat
    extra_hosts:
      - roboboat:127.0.1.1
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    shm_size: 2gb
    # docker stop signals only PID 1, then SIGKILLs the rest; stop-children.sh forwards the
    # TERM to the exec'd keepers and waits for them, so it needs this longer grace period.
    # No init: with pid: host there is no PID namespace to reap in.
    stop_grace_period: 30s
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      ROS_DOMAIN_ID: "42"
      ROS_WS: /home/roboboat/roboboat_ws
      MHSEALS_DATA: /home/roboboat/roboboat_ws/bags
      # Non-interactive bash (docker exec ... bash -c) sources the same ROS and DDS setup.
      BASH_ENV: /home/roboboat/roboboat_ws/.devcontainer/dev.bashrc
      FASTRTPS_DEFAULT_PROFILES_FILE: /home/roboboat/roboboat_ws/config/fastdds.xml
      FASTDDS_DEFAULT_PROFILES_FILE: /home/roboboat/roboboat_ws/config/fastdds.xml
    volumes:
      - ..:/home/roboboat/roboboat_ws
    user: roboboat
    working_dir: /home/roboboat/roboboat_ws
    command: ["bash", "/home/roboboat/roboboat_ws/.devcontainer/stop-children.sh"]

  sitl:
    profiles: ["sitl"]
    image: ${ASTRO_SITL_IMAGE:-lunarzdev/astro:sitl}
    pull_policy: ${ASTRO_PULL_POLICY:-missing}
    platform: linux/amd64
    container_name: ardupilot_sitl
    hostname: ardupilot
    extra_hosts:
      - ardupilot:127.0.1.1
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      VEHICLE: Rover
      DISPLAY: ${DISPLAY:-}
      SITL_EXTRA_ARGS: --console --add-param-file=/param/boat.param --model JSON:127.0.0.1 --out tcp-l:5762
    volumes:
      - ./boat.param:/param/boat.param:rw
    restart: unless-stopped
