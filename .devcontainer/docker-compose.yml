services:
  dev:
    image: ${ASTRO_IMAGE:-lunarzdev/astro:core}
    # Dev Containers replaces this with a locally built UID-adjusted image.
    # "always" would make Compose incorrectly pull that vsc-* image from a registry.
    pull_policy: ${ASTRO_PULL_POLICY:-missing}
    # The workspace's names, generic by default: prebuild.sh writes the profile's (hosts.yaml container:)
    # into .devcontainer/.env, so a team keeps its container, hostname alias and operator config directory.
    container_name: ${ASTRO_CONTAINER:-astro_dev}
    # Robot hosts run headless; the container comes back after reboots unless stopped by hand.
    restart: unless-stopped
    hostname: ${ASTRO_HOSTNAME:-astro}
    extra_hosts:
      - ${ASTRO_HOSTNAME:-astro}:127.0.1.1
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    shm_size: 2gb
    # docker stop signals only PID 1, then SIGKILLs the rest; stop-children.sh forwards the
    # TERM to the exec'd keepers and waits for them, so it needs this longer grace period.
    # No init: with pid: host there is no PID namespace to reap in.
    stop_grace_period: 30s
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      ROS_DOMAIN_ID: ${ASTRO_ROS_DOMAIN_ID:-0}     # ROS 2's default; prebuild injects the vessel's (its profile)
      ROS_WS: /home/roboboat/roboboat_ws
      ASTRO_DATA: /home/roboboat/roboboat_ws/bags   # the data root (run.yaml data.root)
      # Non-interactive bash (docker exec ... bash -c) sources the same ROS and DDS setup.
      BASH_ENV: /home/roboboat/roboboat_ws/.devcontainer/dev.bashrc
      FASTRTPS_DEFAULT_PROFILES_FILE: /home/roboboat/roboboat_ws/config/fastdds.xml
      FASTDDS_DEFAULT_PROFILES_FILE: /home/roboboat/roboboat_ws/config/fastdds.xml
    volumes:
      - ..:/home/roboboat/roboboat_ws
      # Operator config survives container rebuilds; prebuild.sh creates the host directory.
      - ${HOME}/.config/${ASTRO_CONFIG_DIR:-astro}:/home/roboboat/.config/${ASTRO_CONFIG_DIR:-astro}
      # Worktrees at their host paths, testable in place (hw.sh overlay, hw.sh pyenv); prebuild also
      # mounts this workspace at its host path so their .git links resolve. prebuild creates both.
      - ${HOME}/worktrees:${HOME}/worktrees
      - ${HOME}/.cache/wt:${HOME}/.cache/wt
    user: roboboat
    working_dir: /home/roboboat/roboboat_ws
    command: ["bash", "/home/roboboat/roboboat_ws/.devcontainer/stop-children.sh"]

  sitl:
    profiles: ["sitl"]
    image: ${ASTRO_SITL_IMAGE:-lunarzdev/astro:sitl}
    pull_policy: ${ASTRO_PULL_POLICY:-missing}
    platform: linux/amd64
    container_name: ardupilot_sitl
    hostname: ardupilot
    extra_hosts:
      - ardupilot:127.0.1.1
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      VEHICLE: Rover
      DISPLAY: ${DISPLAY:-}
      SITL_EXTRA_ARGS: --console --add-param-file=/param/boat.param --model JSON:127.0.0.1 --out tcp-l:5762
    volumes:
      - ./boat.param:/param/boat.param:rw
    restart: unless-stopped
