services:
  dev:
    image: ${ASTRO_IMAGE:-lunarzdev/astro:cuda}
    runtime: nvidia
    environment:
      DISPLAY: ${DISPLAY:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - zed_resources:/usr/local/zed/resources
      - zed_settings:/usr/local/zed/settings

  # Same image as dev so the viewer relay needs no extra pull.
  lidar-relay:
    image: ${ASTRO_IMAGE:-lunarzdev/astro:cuda}

volumes:
  zed_resources:
  zed_settings:
