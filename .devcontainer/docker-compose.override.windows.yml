services:
  dev:
    environment:
      DISPLAY: host.docker.internal:0
      # A Windows mount is not owned by the container user, so git refuses the workspace ("dubious ownership",
      # exit 128): trust it (git reads these as config, no file to write).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    # Windows has no HOME (Compose would mount /.config/mhseals, /worktrees and /.cache/wt), and a host path such as
    # C:\Users\me\worktrees is not a valid container path, so the Linux worktree mounts do not apply here. The
    # workspace and the operator config (USERPROFILE/.config/mhseals, created by setup.windows.bat) replace the list.
    volumes: !override
      - ..:/home/roboboat/roboboat_ws
      - ${USERPROFILE}/.config/mhseals:/home/roboboat/.config/mhseals
  sitl:
    environment:
      DISPLAY: host.docker.internal:0
