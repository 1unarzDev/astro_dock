# Commands astro_dock itself provides, read by astro-help.py. Packages in the workspace
# ship their own help.yaml (package root or share/<package>/); the schema is in astro-help.py.
package: astro_dock
summary: ROS 2 container workspace helpers, available in every image shell.
commands:
  - name: help
    run: help
    summary: Browse every workspace package's commands, fill in parameters, and run them.
    params:
      - name: --list
        type: bool
        description: Print the commands as plain text instead of opening the browser.
      - name: word
        required: false
        description: With --list, show full details of the commands matching this word.
    examples:
      - help --list
      - help --list install

  - name: astro-ros-install
    run: astro-ros-install
    summary: Install a ROS or apt package into this running container by distro-independent name.
    notes: >-
      ROS names resolve to ros-$ROS_DISTRO-* debs, else build from source into /opt/astro-extra.
      The shell reloads after it. Installs last until the container is recreated; each is recorded
      in .devcontainer/installed.local.txt: move the names to packages.txt (jetson-packages.txt on
      Jetson, requirements.txt for pip) to keep them.
    params:
      - name: --source
        type: bool
        description: Build ROS packages from source even when a deb exists.
      - name: names
        type: list
        description: Package names, e.g. nav2_bringup, htop, or pip:SPEC for /workspace/venv.
    examples:
      - astro-ros-install nav2_bringup
      - astro-ros-install --source examples_rclcpp_minimal_publisher

  - name: colcon build
    run: colcon build
    summary: Build the workspace; the shell reloads the new install/ when it succeeds.
    params:
      - name: --packages-up-to
        type: list
        description: Build these packages and their dependencies only.
      - name: --packages-select
        type: list
        description: Build exactly these packages.
      - name: --symlink-install
        type: bool
        description: Symlink Python and data files so edits apply without a rebuild.
    examples:
      - colcon build --packages-up-to my_package

  - name: ros_env
    run: ros_env
    summary: Reload ROS, the image overlays and the workspace install/ in this shell.

  - name: ros_net
    run: ros_net
    summary: Re-detect this host's robot-subnet address and pin DDS to it (each new shell does this).
    notes: Set ASTRO_DDS_ADDRESS to force an address; off the robot subnet DDS uses all interfaces.
    params:
      - name: -v
        type: bool
        description: Print the choice.

  - name: rviz2
    run: rviz2
    summary: RViz with the workspace dark theme, pinned to the robot network interface.

  - name: setup.linux.sh
    run: ./setup.linux.sh
    summary: Prepare a Linux host for the containers, stage by stage (run on the host, not in a container).
    notes: Each stage explains itself and asks first; reruns are safe.
    params:
      - name: --components
        default: clock,docker,gpu,devices,devtools,compose
        description: Comma-separated stages (also deps, mdns, repos, gateway, boat, jetson, operator-key), e.g. clock,docker.
      - name: --dry-run
        type: bool
        description: Print the commands without running them.
      - name: --yes
        type: bool
        description: Approve the plan and every stage.
      - name: --non-interactive
        type: bool
        description: No prompts (needs --yes).
      - name: --vessel
        description: The vessel profile (default this machine's, as hw.sh whoami finds it).
      - name: --host
        description: This machine's registry host, or any other name for a generic control station.
      - name: --role
        type: list
        description: Repos stage roles whose repositories to add to repos.all (default this host's roles).
    examples:
      - ./setup.linux.sh --components clock --dry-run
      - ./setup.linux.sh --components repos --role operator
      - ./setup.linux.sh --components mdns

  - name: hw.sh
    run: $ROS_WS/hw.sh
    summary: Robot device tooling (status, plan, apply, verify, rollback per device kind of the vessel profile).
    notes: >-
      Profiles are yours: ~/.config/astro/profiles.env names ASTRO_PROFILES (a directory) or
      ASTRO_PROFILES_URL at ASTRO_PROFILES_REF (hw.sh profile sync URL [REF] checks it out at profiles/);
      without one it runs in generic mode with no device kinds. The machine finds its own host and vessel (hostname or permanent MAC);
      --vessel and --host override. Secrets live in ~/.config/astro/secrets.env (mode 600).
    params:
      - name: --vessel
        required: false
        description: The vessel profile when this machine matches none.
      - name: --host
        required: false
        description: This machine's registry host.
      - name: command
        description: whoami [--root|--registry], env [KEY], profile show [NAME], profile sync [URL [REF]], secrets check, hot REPO, station take|release, overlay PATH, pyenv PATH, build, image, or KIND VERB (each with --help).
    examples:
      - $ROS_WS/hw.sh whoami
      - $ROS_WS/hw.sh env ROUTER_IP
      - $ROS_WS/hw.sh secrets check
      - $ROS_WS/hw.sh --vessel VESSEL radio status
      - $ROS_WS/hw.sh hosts repos

  - name: net/share.sh
    run: $ROS_WS/net/share.sh
    summary: Create a Samba network folder (interactive; run on the host). Its HOST.local name comes from setup.linux.sh --components mdns.
    notes: Asks for the share name, user and password; mounts it at /mnt/NAME and keeps the login in ~/.smbcredentials.

  - name: net/mesh.sh
    run: $ROS_WS/net/mesh.sh
    summary: Join a WARP mesh with the code its owner sent, leave it, or own one on your Cloudflare account (run on the host).
    notes: join and leave need only curl and sh; setup, invite, devices, revoke and teardown run cx mesh, or cx's standalone util without cx.

  - name: fetch_bags.sh
    run: $ROS_WS/fetch_bags.sh
    summary: Copy a host's session bags into bags/NAME (reads the remote only; rsync, else tar over ssh).
    params:
      - name: source
        description: HOST:REMOTE_DIR, e.g. jetson:~/astro_dock/bags/SESSION.
      - name: name
        description: The directory under bags/ to copy into.

  - name: astro-clock.py
    run: $ROS_WS/.devcontainer/astro-clock.py
    summary: Clock offset of each LAN host by one SNTP query (default the time_server role and the STATIC_LEASES hosts).
    notes: Exits 1 when a host is more than 50 ms off, unsynchronised or silent.
    params:
      - name: hosts
        type: list
        required: false
        description: Hosts to ask instead of the vessel's network env.
