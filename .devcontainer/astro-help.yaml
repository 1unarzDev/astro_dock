# Commands astro_dock itself provides, read first by astro help (.devcontainer/astro-help.py): astro's own
# verbs (run: astro VERB; ros: the plain ROS 2 they compose), then the workspace helpers. Packages in the
# workspace ship their own help.yaml (package root or share/<package>/); the schema is in astro-help.py.
# Voice: summary and notes in everyday words for a new teammate ("the robot", "its computers"); config keys,
# topics, paths and code words go in details.
package: astro
summary: Run the robot day to day - start and stop it, test it, record, log and keep notes.
commands:
  - name: help
    run: astro help
    summary: Look up any command, fill in its options and run it from one screen; use it whenever you forget how something works.
    notes: Arrow keys move, Enter opens a command, r runs it. For one command in plain text, type astro COMMAND --help.
    details: Reads every help.yaml of the workspace packages, plus the extra files the vessel profile lists under astro.help.
    params:
      - name: --list
        type: bool
        description: Print the commands as plain text instead of opening the browser.
      - name: --all
        type: bool
        description: Also list the rarely used setup commands (computer setup, images, overlays).
      - name: word
        required: false
        description: 'Show everything about each command whose name or summary mentions this word, e.g. rec.'
        free: any word to search for
    examples:
      - astro help --list
      - astro help rec

  - name: start
    run: astro start
    summary: Open a terminal in this computer's development container, starting it first when it is down. Run it from your own terminal.
    notes: The first start on a computer also sets it up and can take a few minutes; after that it opens at once. Exit the terminal and the container keeps running.
    ros: docker start CONTAINER (when stopped); docker exec -it CONTAINER bash
    details: >-
      The container is this checkout's dev service (ASTRO_CONTAINER, .devcontainer/.env, else the one Compose
      labels as this checkout's). A running one opens as it is and a stopped one is started as it is (docker
      start); neither is rebuilt or recreated. Only with none at all is one created: prebuild.sh first without
      .devcontainer/docker-compose.override.yml, then devcontainer up, else docker compose up -d --no-recreate dev.
      The shell gets the vessel profile's environment, as astro on does.
    examples:
      - astro start

  - name: "on"
    run: astro on
    summary: Open a terminal on one of the robot's computers (or run one command there), from wherever you are.
    notes: Pick the computer by name, or a unique part of it. With the simulator selected, it runs right here.
    ros: ssh USER@HOST docker exec -it CONTAINER bash
    details: The host is a registry host of the vessel profile; a vessel without ssh hosts (the sim) runs the shell here with its environment.
    params:
      - {name: host, choices_from: 'astro _choices on', description: 'Which computer of the robot to open, e.g. a part of its name or sim; leave empty to pick from a list.'}
      - {name: cmd, type: list, required: false, description: 'One command to run there instead of a terminal, e.g. astro test list.'}
    examples:
      - astro on sim
      - astro on sim astro test list

  - name: up
    run: astro up
    summary: Start the robot's software (each part on the computer it belongs to) and wait until it's running. Run this first after power-on.
    notes: Each part prints one line, "up" when it is running or FAILED with the end of its log (see astro logs NAME). It keeps running if your connection drops.
    ros: ssh USER@HOST docker exec CONTAINER bash -c 'setsid -f ros2 launch PKG FILE.launch.py ARGS > LOG'; ros2 topic hz TOPIC
    details: >-
      The parts are the vessel profile's astro.stacks, started in order with their needs first; a part is up when
      its ready topics publish (at most 60 s each). Each runs in a private tmux server (tmux -L astro) when the
      container has tmux, else under setsid; its log is DATA/DATE/stacks/NAME.log. A part whose ready topics already
      publish without astro's own process (started by hand) is used, not started twice; before starting
      a part astro removes the host's Fast DDS shared-memory files no live process holds.
    params:
      - {name: names, type: list, required: false, choices_from: 'astro _choices stacks', description: 'Only these parts of the software, e.g. drive nav; leave empty for the usual set. Parts they rely on start too.'}
      - {name: --with, choices_from: 'astro _choices options', description: 'An optional extra for a part you start, e.g. controller to also start the speed controller with drive.'}
      - {name: --force, type: bool, description: 'Start a part even when it already runs outside astro (its ready topics publish), which makes a second copy.'}
    examples:
      - astro up
      - astro up drive --with controller
      - astro up nav

  - name: down
    run: astro down
    summary: Stop the robot's software, all of it or only the parts you name, cleanly and in the right order.
    notes: Run it before powering off or before a bench tool that needs the hardware to itself.
    ros: ssh USER@HOST docker exec CONTAINER kill -INT -- -PGID
    details: Stops in reverse start order with SIGINT to each process group, then SIGTERM after 20 s; parts that need a stopped part stop first.
    params:
      - {name: names, type: list, required: false, choices_from: 'astro _choices stacks', description: 'Only these parts of the software, e.g. drive; leave empty to stop everything.'}
    examples:
      - astro down
      - astro down drive

  - name: logs
    run: astro logs
    summary: Show what one part of the robot's software has been printing, to see why it failed or what it is doing.
    notes: Add -f to keep watching new lines; Ctrl-C stops watching (the part keeps running).
    ros: ssh USER@HOST docker exec CONTAINER tail -F DATA/DATE/stacks/NAME.log
    details: The last 40 lines of DATA/DATE/stacks/NAME.log on the part's computer.
    params:
      - {name: name, choices_from: 'astro _choices stacks', description: 'The part of the software whose output to show, e.g. drive; leave empty to pick.'}
      - {name: -f, type: bool, description: 'Keep following the log as it grows, until Ctrl-C.'}
    examples:
      - astro logs drive -f

  - name: status
    run: astro status
    summary: One page that tells you whether the robot is ready - which parts are running, its sensors, any recording, and the next test to do.
    notes: Use --watch to keep it on screen and updating while you work.
    ros: ps -o etimes= -p PID; ros2 topic hz TOPIC; ros2 node list; ros2 topic echo --once TOPIC
    details: >-
      Each stack (host, up/down, uptime, ready rates, log path), then nodes, the tests file's topics, recording,
      the last log lines and the next test. The stacks are asked from here over ssh; outside ROS the rest runs on
      the profile's astro.home host (astro on HOME astro ...); --here runs it all here.
    params:
      - {name: --watch, type: bool, description: 'Redraw the whole page every second until you press Ctrl-C.'}

  - name: rec start
    run: astro rec start
    summary: Start recording the robot's data (sensors, commands, position) so you can replay or study a run later.
    notes: Use a short label so you can find it later, e.g. astro rec start lean lake. Stop it with astro rec stop.
    ros: ros2 bag record -s mcap -d 300 -o DIR TOPIC... (or -a)
    details: >-
      Records an mcap bag in 300 s splits into DATA/DATE/bags/HHMMSS-LABEL. Presets come from the vessel
      profile's astro.bags file; the events topic is always recorded. Outside ROS it runs on the profile's
      astro.home host; --here runs it here.
    params:
      - {name: preset, required: false, choices_from: 'astro _choices presets', description: 'Which set of data to record, e.g. lean for the essentials only; leave empty for the first set.'}
      - {name: label, required: false, description: 'A short word to find the recording by later, e.g. lake or trial3.', free: a label of your choosing}
    examples:
      - astro rec start lean lake

  - name: rec stop
    run: astro rec stop
    summary: Stop the recording you started, closing the file cleanly so nothing is lost.
    ros: kill -INT PID
    details: Sends SIGINT to the recorder. Outside ROS it runs on the profile's astro.home host; --here runs it here.

  - name: rec ls
    run: astro rec ls
    summary: List today's recordings with when each started and stopped, and the notes you logged during each.
    ros: ros2 bag info DIR
    details: Outside ROS it runs on the profile's astro.home host; --here runs it here.

  - name: rec fetch
    run: astro rec fetch
    summary: Find bags on every computer of the robot and copy the ones you pick to a laptop. With no arguments it searches and lets you pick.
    notes: Space picks a bag, a picks every new one, Enter asks where to copy them. A copy that stopped picks up where it left off when you run it again.
    ros: rsync -a --partial -e ssh USER@HOST:DATA/DATE/bags/NAME/ DATA/DATE/bags/NAME/
    details: >-
      Searches this machine and every registry ssh host in parallel (25 s each; one line for each it can't
      reach): on each host's own shell, the data root its dev container sees (astro.data, else
      $ASTRO_DATA, else $ROS_WS/bags), through the container's mounts. A bag is any directory with
      metadata.yaml or .mcap/.db3 files (DATE/bags/NAME, older top-level and sessions/ layouts). A bag
      still being written (no metadata.yaml, or its day's .rec.pid recorder running) is never copied; one at
      the destination with the same path and size counts as copied. rsync runs on the hosts' own shells
      (needs rsync there), from here, or on the destination when neither end is here. The summary goes in
      today's log (rec). --list [--json] lists only; --names prints BAG<TAB>about for pickers; without a
      terminal and without bags it prints the list and exits 2.
    params:
      - {name: bags, type: list, required: false, choices_from: 'astro rec fetch --list --names', description: 'The bags to copy, by name or a unique part of it, e.g. 2026-11-24/101500-lake; leave empty to pick.'}
      - {name: --from, choices_from: 'astro _choices on', description: 'Copy only bags from this computer, e.g. robot-main; leave empty to look on all of them.'}
      - {name: --to, choices_from: 'astro _choices on', description: 'The computer the bags are copied to, e.g. station; leave empty for this one.'}
      - {name: --new, type: bool, description: 'Copy every bag that is not at the destination yet, without asking.'}
      - {name: --date, free: 'a day is typed, not picked', description: 'Copy every bag recorded on this day, e.g. 2026-11-24.'}
      - {name: --list, type: bool, description: 'Only show the bags on every computer and which are copied; copy nothing.'}
      - {name: --json, type: bool, description: 'With --list, print the bags as JSON for scripts and agents.'}
    examples:
      - astro rec fetch
      - astro rec fetch --list
      - astro rec fetch --from robot-main --new
      - astro rec fetch --to station 2026-11-24/101500-lake

  - name: mark
    run: astro mark
    summary: Write a quick note about what just happened ("wind picked up") into today's log and the recording, stamped with the time.
    notes: It returns at once. If the robot can't be reached, the note is kept and sent later with its original time.
    ros: "ros2 topic pub --once /events std_msgs/msg/String \"{data: 'HH:MM:SS  mark  TEXT'}\""
    details: >-
      Published on the events topic. Outside ROS it runs on the profile's astro.home host in the background
      (ssh killed after 20 s); a failed one is kept in ~/.local/state/astro/VESSEL-marks.pending and sent after
      the next forwarded command or astro sync. --here runs it here.
    params:
      - {name: text, type: list, description: 'What happened, in your own words, e.g. wind picked up from north.'}
    examples:
      - astro mark wind picked up from north

  - name: log
    run: astro log
    summary: Read today's log - your notes, recordings, tests and changes - to see what happened and when.
    ros: cat DATA/DATE/log.txt
    details: DATA/DATE/log.txt. Outside ROS it runs on the profile's astro.home host; --here runs it here.
    params:
      - {name: -n, type: int, description: 'Show only the last few lines of the log, e.g. 20.'}

  - name: test
    run: astro test
    summary: Run a guided test that measures how the robot really moves, so its settings can be tuned. Ctrl-C stops the robot.
    notes: Start with astro test list, and astro test status for what to do next; a passive "watch" test just watches while you drive by hand, for small spaces. Each test ends with the astro apply line that saves its result.
    ros: ros2 topic pub /EFFORT geometry_msgs/msg/Twist ... (20 Hz) while ros2 topic echo /ODOM
    details: >-
      Tests and groups come from the vessel profile's astro.tests file; Ctrl-C sends neutral. The software it
      needs (the profile's astro.test_needs, or a test's own needs) starts first. Each test prints its control
      layer and old -> new values; a test with rec: records a bag while it runs. A watch test publishes nothing:
      it fits from the operator's steady single-axis holds until its levels are covered. Outside ROS it runs on the profile's astro.home host, and keeps running if
      the link drops; --here runs it here.
    params:
      - {name: name, choices_from: 'astro _choices test', description: 'The test or group of tests to run, e.g. still; or list or status; leave empty to pick.'}
      - {name: --space, choices: [large, small], default: large, description: 'How much room the robot has: small is a pool or tank (a few metres), large is open space.'}
      - {name: --amp, type: float, description: 'How hard to push, from 0 to 1, instead of the room''s usual strength, e.g. 0.3.'}
    examples:
      - astro test list
      - astro test status
      - astro test still

  - name: apply
    run: astro apply
    summary: Save a test's result into the robot's settings and use it right away; a backup is kept so astro undo can take it back.
    notes: Leave the name empty to pick from results not yet saved. A result the settings check refuses is rolled back.
    ros: ros2 param set NODE PARAM VALUE
    details: Writes the profile's astro.state file (backup first), runs astro.check on it, rolls back on refusal, then sets the live parameters. Outside ROS it runs on astro.home; --here runs it here.
    params:
      - {name: result, choices_from: 'astro _choices apply', description: 'The test whose latest result to save, or a result file, e.g. couple-surge; leave empty to pick.'}

  - name: undo
    run: astro undo
    summary: "Undo one of today's applies: pick which change to reverse, see exactly what goes back, and the live boat is updated too."
    notes: Only that apply's settings go back; later changes to other settings stay. If a later apply changed the same setting, you choose to restore it anyway or keep it.
    ros: ros2 param set NODE PARAM VALUE
    details: >-
      Each apply is recorded in STATE.history.jsonl next to the profile's astro.state file. Undo writes the old
      values back (backup first), runs astro.check (rolled back on refusal), sets the live parameters and logs
      one line. Without a terminal and without --last or --list it prints the history and exits 2. Outside ROS
      it runs on astro.home; --here runs it here.
    params:
      - {name: --last, type: bool, description: 'Undo the newest apply without asking (for scripts); a setting changed since is kept.'}
      - {name: --list, type: bool, description: 'Only print the list of recorded applies, newest first, and change nothing.'}
    examples:
      - astro undo
      - astro undo --list

  - name: bundle
    run: astro bundle
    summary: Pack today's settings, results and log into one file, to share or to replay the day in the simulator.
    notes: It prints the file's name and, if your team set one, the next step to run with it.
    ros: tar czf bundle.tgz STATE DATA/DATE
    details: A tgz of the state file and DATA/DATE; then prints the vessel profile's astro.bundle_next with {bundle} replaced. Outside ROS it runs on astro.home; --here runs it here.
    params:
      - {name: --bags, type: bool, description: 'Also include today''s recordings in the file (it gets large).'}

  - name: sim up
    run: astro sim up
    level: core
    summary: Start the simulator, a virtual robot in a virtual world, and wait until it is ready to drive.
    notes: Then use the other commands as on the real robot, with the sim selected (e.g. astro on sim).
    details: "The backend is the sim profile's astro.sim, run as `CMD VERB [args]` with that profile's environment (ROS_DOMAIN_ID, ASTRO_DATA, ASTRO_STATE)."
    params:
      - {name: args, type: list, required: false, description: 'Extra options for the simulator, passed on as they are, e.g. --headless (sim up --help lists them).'}
    examples:
      - astro sim up --headless

  - name: sim down
    run: astro sim down
    level: core
    summary: Stop the simulator when you are done with it.
    details: "The backend is the sim profile's astro.sim, run as `CMD VERB [args]` with that profile's environment."
    params:
      - {name: args, type: list, required: false, description: 'Extra options for the simulator, passed on as they are, e.g. --force (sim down --help lists them).'}

  - name: sim status
    run: astro sim status
    level: core
    summary: See what is running in the simulator, without changing anything.
    details: "The backend is the sim profile's astro.sim, run as `CMD VERB [args]` with that profile's environment."
    params:
      - {name: args, type: list, required: false, description: 'Extra options for the simulator, passed on as they are, e.g. --json (sim status --help lists them).'}

  - name: sim check
    run: astro sim check
    level: core
    summary: Ask whether the simulator is ready to use; handy in scripts that should wait for it.
    details: "Exit 0 when ready. The backend is the sim profile's astro.sim, run as `CMD VERB [args]` with that profile's environment."
    params:
      - {name: args, type: list, required: false, description: 'Extra options for the simulator, passed on as they are, e.g. --wait 120 (sim check --help lists them).'}
    examples:
      - astro sim check --wait 120

  - name: sim restart
    run: astro sim restart
    level: core
    summary: Restart one part of the simulator (say, navigation after a code change) and keep the rest running.
    details: "The backend is the sim profile's astro.sim, run as `CMD VERB [args]` with that profile's environment."
    params:
      - {name: part, description: 'The part of the simulator to restart, as the simulator names it, e.g. nav.', free: the sim backend defines its parts}
      - {name: args, type: list, required: false, description: 'Extra options for the simulator, passed on as they are, e.g. --headless (sim restart --help lists them).'}
    examples:
      - astro sim restart nav

  - name: sim logs
    run: astro sim logs
    level: setup
    summary: Show the simulator's recent output, to see why it failed to start.
    details: "The backend is the sim profile's astro.sim, run as `CMD VERB [args]` with that profile's environment."
    params:
      - {name: args, type: list, required: false, description: 'Extra options for the simulator, passed on as they are, e.g. -f (sim logs --help lists them).'}

  - name: check
    run: astro check
    summary: Walk through your team's checklist for the day (before launch, after a run) item by item; some items check themselves.
    notes: Use --list to see the items and how they went last time without running anything.
    ros: bash -c COMMAND (each check:)
    details: >-
      Checklists are checklists/NAME.md of the field repo (the profile's astro.field); ticks save to the
      session's checks.yaml. An item ending in check: `COMMAND` runs it (exit 0 = ok); other items are asked y/n.
      Example item: "- [ ] sensors up - check: `astro status`".
    params:
      - {name: name, choices_from: 'astro _choices check', description: 'Which checklist to go through, e.g. lake; leave empty to pick from the list.'}
      - {name: --list, type: bool, description: 'Print the items and their last state, and run nothing.'}
    examples:
      - astro check lake --list
      - astro check lake

  - name: issue
    run: astro issue
    summary: Report a problem you just saw to the team's issue list, with the time, the robot and the latest log lines attached.
    notes: Offline, it is kept and filed by the next astro sync.
    ros: gh issue create -R OWNER/REPO --title TEXT --body-file -
    details: Files a GitHub issue on the field repo (the profile's astro.field) with the current bag and the last 10 log lines.
    params:
      - {name: text, description: 'A one-line title for the problem, in quotes, e.g. "remote ignored after restart".', free: issue text}
      - {name: --label, description: 'A label to tag the issue with (repeat for more), e.g. safety.', free: labels live on GitHub}
    examples:
      - astro issue "remote ignored after restart" --label safety

  - name: sync
    run: astro sync
    summary: Save today's log, results and recording list to the team's shared notes and send any queued issues and notes. Run it at the end of the day.
    notes: Safe to run any time and more than once. Offline, it says so and changes nothing.
    ros: git pull; cp DATA/DATE/log.txt SESSION/; git commit; git push; gh issue create
    details: >-
      Clones or pulls the field repo, copies log.txt, results (without raw samples) and a bag index (never bag
      data) into sessions/DATE-LABEL, commits and pushes. With astro.home reached over ssh it first fetches that
      host's day folder and sends pending marks. ASTRO_FIELD_DIR overrides field.dir.
    examples:
      - astro sync

  - name: docs
    run: astro docs
    summary: Show where to read up - today's plan, checklists, handoff notes, issues, today's log and recordings, and each project's documentation with links.
    ros: 'none: reads files only (ls; git remote get-url origin)'
    details: The field repo (clone, session, plan, checklists, handoff/, plans/, issues), the day log and bags, and each repo's README.md and docs/*.md with GitHub links.
    examples:
      - astro docs

  - name: show
    run: astro show
    summary: Summarize a day's session - its plan, which checks passed, how many tests, results and notes, and the open issues.
    ros: cat SESSION/plan.md; gh issue list
    details: With astro.home reached over ssh it reads the synced copy, else today's astro log on home.
    params:
      - {name: date, default: auto, description: 'The day to summarize, as YYYY-MM-DD, e.g. 2026-11-24; auto is today.', free: a date}
    examples:
      - astro show
      - astro show 2026-11-24

  - name: clock
    run: astro clock
    summary: Check that the robot's computers agree on the time with this one (recordings and logs line up only if they do); --fix corrects them.
    notes: Each computer prints how far off it is. If one keeps drifting, it can't reach its time source.
    ros: ssh USER@HOST 'date +%s.%N; chronyc -n -c sources'
    details: >-
      Each registry host's offset, its chrony source and whether it reaches it. --fix runs sudo -n date -u -s
      @EPOCH and chronyc makestep on each robot host (every ssh host without the operator role) more than 0.5 s off.
    params:
      - {name: --fix, type: bool, description: 'Set the robot computers'' clocks from this one when they are off.'}
    examples:
      - astro clock
      - astro clock --fix

  - name: astro-ros-install
    run: astro-ros-install
    level: setup
    summary: Install an extra ROS or system (apt or pip) package into this container, to try something out.
    notes: It lasts until the container is rebuilt; to keep it, add the name to the image's package list.
    details: >-
      ROS names resolve to ros-$ROS_DISTRO-* debs, else build from source into /opt/astro-extra; the shell
      reloads after it. Each install is recorded in .devcontainer/installed.local.txt: move the names to
      packages.txt (jetson-packages.txt on Jetson, requirements.txt for pip) to keep them.
    params:
      - name: --source
        type: bool
        description: Build ROS packages from source even when a ready-made package exists.
      - name: names
        type: list
        description: Package names, e.g. nav2_bringup, htop, or pip:SPEC for a Python package.
    examples:
      - astro-ros-install nav2_bringup
      - astro-ros-install --source examples_rclcpp_minimal_publisher

  - name: ros_env
    run: ros_env
    level: setup
    summary: Reload ROS and the workspace in this terminal, after a build or an install.
    details: Sources ROS, the image overlays and the workspace install/.

  - name: ros_net
    run: ros_net
    level: setup
    summary: Make this terminal talk to the robot over the right network connection again (each new terminal does this by itself).
    details: Re-detects this host's robot-subnet address and pins DDS to it; ASTRO_DDS_ADDRESS forces one; off the robot subnet DDS uses all interfaces.
    params:
      - name: -v
        type: bool
        description: Print the address it chose.

  - name: rviz2
    run: rviz2
    level: setup
    summary: Open RViz, the 3D viewer for the robot's sensors and maps, set up for the robot network.

  - name: setup.linux.sh
    run: ./setup.linux.sh
    level: setup
    summary: Prepare a Linux computer to run the robot's containers, step by step (run it on the computer itself, not in a container).
    notes: Each step explains itself and asks first; running it again is safe.
    params:
      - name: --components
        default: clock,docker,gpu,devices,devtools,compose
        description: The steps to run, comma-separated (also deps, mdns, repos, gateway, boat, jetson, operator-key), e.g. clock,docker.
      - name: --dry-run
        type: bool
        description: Print the commands without running them.
      - name: --yes
        type: bool
        description: Approve the plan and every step.
      - name: --non-interactive
        type: bool
        description: No prompts (needs --yes).
      - name: --vessel
        default: auto
        description: Which robot this computer belongs to; auto finds it.
      - name: --host
        default: auto
        description: This computer's name in the robot's list of computers (auto finds it), or any other name for a spare control laptop.
      - name: --role
        type: list
        default: auto
        description: The jobs this computer does, which decide the repositories it gets; auto is its own.
    examples:
      - ./setup.linux.sh --components clock --dry-run
      - ./setup.linux.sh --components repos --role operator
      - ./setup.linux.sh --components mdns

  # hw.sh verbs (machine, network and deploy): astro VERB runs $ROS_WS/hw.sh VERB; hw.sh stays usable directly.
  - name: profile
    run: $ROS_WS/hw.sh whoami
    summary: Show which robot and which computer astro thinks this is, and how it decided.
    notes: If it guessed wrong, set the robot with ASTRO_VESSEL or run astro profile sync.
    params:
      - {name: --root, type: bool, description: 'Print only the folder the robot settings come from.'}
      - {name: --registry, type: bool, description: 'Print only the file listing the robot''s computers.'}
  - name: profile env
    run: $ROS_WS/hw.sh env
    summary: Show the robot's network settings, or one of them such as a computer's address.
    details: The vessel's network env path, or one key, or a role address as <ROLE>_IP.
    params:
      - {name: key, required: false, description: 'One network setting or computer address to print, e.g. ROUTER_IP.', free: keys come from the profile env file}
  - name: profile show
    run: $ROS_WS/hw.sh profile show
    summary: Show all of a robot's settings as astro sees them, without passwords.
    details: The merged vessel profile (its extends chain), secrets left out.
    params:
      - {name: name, default: auto, description: 'Which robot''s settings to show, e.g. sim; auto is this computer''s robot.', free: profile names come from the profile set}
  - name: profile sync
    run: $ROS_WS/hw.sh profile sync
    summary: Update your team's robot settings to the version your team picked; run it when astro warns the settings are out of date.
    details: Checks out the profile set at ASTRO_PROFILES_REF; profile sync URL REF records a new URL and ref first.
  - name: profile secrets
    run: $ROS_WS/hw.sh secrets check
    summary: Check that the passwords and keys the robot needs are filled in; it names what is missing and never shows a value.
    details: Reads ~/.config/astro/secrets.env.
  - name: hot
    run: $ROS_WS/hw.sh hot
    summary: "Put your current code on the robot: sends the projects you pick (even uncommitted changes) to the robot's computers, through the operator laptop if needed, and rebuilds them. Works with no internet on the robot."
    notes: Run it in this computer's own terminal, not inside the container. Try --dry-run first; it shows the way to each computer, what would change there and whether it rebuilds, and sends nothing.
    details: >-
      REPO is any src/REPO, astro_dock (the workspace) or profiles (also pins the host's ASTRO_PROFILES_REF).
      Each boat host that runs it is reached by ssh straight, else through its registry jump or the vessel's
      operator station as a jump; the route prints first. The working tree goes as a git bundle, checked out on
      field/DATE after the host's own edits are backed up; then one colcon build per host of the packages that
      need it, and one result line per host. hw.sh hosts apply returns the hosts to main.
    params:
      - {name: repos, type: list, required: false, choices_from: '$ROS_WS/hw.sh hot --choices', description: 'The projects to send, e.g. a src/ repo, astro_dock (this toolkit) or profiles (the robot settings); leave empty to pick from the ones that changed.'}
      - {name: --all, type: bool, description: 'Send every project, changed or not, to the computers that run it.'}
      - {name: --host, default: auto, choices_from: 'astro _choices on', description: 'Send to only this one computer of the robot; auto is every computer that runs the project.'}
      - {name: --dry-run, type: bool, description: 'Show the route, the projects, commits and files, and whether it rebuilds; send nothing.'}
      - {name: --untracked, type: bool, description: 'Also send new files git does not track yet (off by default, so notes and scratch files stay on this computer).'}
    examples:
      - astro hot --dry-run --all
      - astro hot astro_dock profiles
  - name: station take
    run: $ROS_WS/hw.sh station take
    level: setup
    summary: Make this laptop the one that operates the robot (its link, network gateway and time source).
    details: Takes the operator station roles (robot link, gateway, time), keys and the station file.
    params:
      - {name: --dry-run, type: bool, description: Show the steps; change nothing.}
  - name: station release
    run: $ROS_WS/hw.sh station release
    level: setup
    summary: Stop this laptop operating the robot, so another one can take over.
  - name: overlay
    run: $ROS_WS/hw.sh overlay
    level: setup
    summary: Build only what changed in a separate copy of the code, on top of the main build, to try it side by side.
    details: Colcon-builds a worktree's changed packages as an overlay on the workspace install and prints the source line.
    params:
      - {name: path, description: The folder of that copy (a git worktree).}
      - {name: --base, default: origin/main, description: Compare against this version.}
  - name: pyenv
    run: $ROS_WS/hw.sh pyenv
    level: setup
    summary: Run a separate copy's Python code straight from its folder, without building.
    details: Prints the PYTHONPATH that runs a worktree's pure-Python packages from source, no colcon.
    params:
      - {name: path, description: The folder of that copy (a git worktree).}
  - name: build
    run: $ROS_WS/hw.sh build
    summary: Build the workspace code so your changes take effect; it starts from scratch on its own when it has to.
    details: The workspace's colcon build in its dev container, from clean when the image or colcon defaults changed.
  - name: image
    run: $ROS_WS/hw.sh image
    level: setup
    summary: Show which container image this computer uses, and update it if a newer one is out.
    params:
      - {name: --pull, type: bool, description: Download it when a newer one is available.}
      - {name: --local, type: bool, description: Show the local image built on top of it.}
  - name: device status
    run: $ROS_WS/hw.sh device status
    summary: See how one piece of robot hardware (radio, router, computers) is set up right now, without changing it.
    notes: astro device kinds lists the hardware you can pick.
    details: >-
      The kinds come from the vessel profile, each with its driver; hw.sh KIND VERB is the same. Profiles live
      where ~/.config/astro/profiles.env says (ASTRO_PROFILES, or ASTRO_PROFILES_URL at ASTRO_PROFILES_REF);
      secrets in ~/.config/astro/secrets.env (mode 600).
    params:
      - {name: kind, choices_from: '$ROS_WS/hw.sh device kinds', description: 'Which piece of hardware to look at, e.g. radio; leave empty to pick.'}
      - {name: args, type: list, required: false, description: 'Extra options for that hardware, e.g. --verbose (astro device status KIND --help).'}
    examples:
      - astro device status hosts

  - name: device plan
    run: $ROS_WS/hw.sh device plan
    level: setup
    summary: Preview what device apply would change on one piece of hardware, without changing it.
    details: The kinds come from the vessel profile, each with its driver; hw.sh KIND VERB is the same.
    params:
      - {name: kind, choices_from: '$ROS_WS/hw.sh device kinds', description: 'Which piece of hardware to look at, e.g. radio; leave empty to pick.'}
      - {name: args, type: list, required: false, description: 'Extra options for that hardware, e.g. --verbose (astro device plan KIND --help).'}
    examples:
      - astro device plan radio

  - name: device apply
    run: $ROS_WS/hw.sh device apply
    level: setup
    summary: Set up one piece of hardware the way the robot's settings say it should be.
    notes: Run device plan first to see the changes; device rollback undoes them.
    details: The kinds come from the vessel profile, each with its driver; hw.sh KIND VERB is the same.
    params:
      - {name: kind, choices_from: '$ROS_WS/hw.sh device kinds', description: 'Which piece of hardware to set up, e.g. radio; leave empty to pick.'}
      - {name: args, type: list, required: false, description: 'Extra options for that hardware, e.g. --verbose (astro device apply KIND --help).'}
    examples:
      - astro device apply radio

  - name: device verify
    run: $ROS_WS/hw.sh device verify
    summary: Check that one piece of hardware is set up the way the robot's settings say; it lists anything that differs.
    details: The kinds come from the vessel profile, each with its driver; hw.sh KIND VERB is the same.
    params:
      - {name: kind, choices_from: '$ROS_WS/hw.sh device kinds', description: 'Which piece of hardware to check, e.g. radio; leave empty to pick.'}
      - {name: args, type: list, required: false, description: 'Extra options for that hardware, e.g. --verbose (astro device verify KIND --help).'}
    examples:
      - astro device verify radio

  - name: device rollback
    run: $ROS_WS/hw.sh device rollback
    level: setup
    summary: Undo the last device apply on one piece of hardware.
    details: The kinds come from the vessel profile, each with its driver; hw.sh KIND VERB is the same.
    params:
      - {name: kind, choices_from: '$ROS_WS/hw.sh device kinds', description: 'Which piece of hardware to restore, e.g. radio; leave empty to pick.'}
      - {name: args, type: list, required: false, description: 'Extra options for that hardware, e.g. --verbose (astro device rollback KIND --help).'}
    examples:
      - astro device rollback radio

  - name: device kinds
    run: $ROS_WS/hw.sh device kinds
    level: setup
    summary: List the pieces of hardware the device commands can manage on this robot.
    details: The vessel profile's device kinds with their driver, one per line.

  - name: net/share.sh
    run: $ROS_WS/net/share.sh
    level: setup
    summary: Share a folder on the network so teammates can open it (run it on the computer, not in a container).
    notes: It asks for the share name, user and password. Its .local name comes from setup.linux.sh --components mdns.
    details: Creates a Samba share, mounts it at /mnt/NAME and keeps the login in ~/.smbcredentials.

  - name: net/mesh.sh
    run: $ROS_WS/net/mesh.sh
    level: setup
    summary: Join a private network that links your computers over the internet, with the code its owner sent you; leave it, or run your own.
    details: A Cloudflare WARP mesh. join and leave need only curl and sh; setup, invite, devices, revoke and teardown run cx mesh, or cx's standalone util without cx.
