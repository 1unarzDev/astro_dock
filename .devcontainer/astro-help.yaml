# Commands astro_dock itself provides, read first by astro help (.devcontainer/astro-help.py): astro's own
# verbs (run: astro VERB; ros: the plain ROS 2 they compose), then the workspace helpers. Packages in the
# workspace ship their own help.yaml (package root or share/<package>/); the schema is in astro-help.py.
package: astro
summary: The astro tool and the ROS 2 container workspace helpers.
commands:
  - name: help
    run: astro help
    summary: Browse every workspace package's commands, fill in parameters, and run them (astro VERB --help for one).
    params:
      - name: --list
        type: bool
        description: Print the commands as plain text instead of opening the browser.
      - name: word
        required: false
        description: Show full details of the commands matching this word.
    examples:
      - astro help --list
      - astro help rec

  - name: "on"
    run: astro on
    summary: A shell (or one command) in a host's dev container over ssh; a vessel without ssh hosts (the sim) runs here with its env.
    ros: ssh USER@HOST docker exec -it CONTAINER bash
    notes: The host is a registry host of the vessel profile, matched by name or substring.
    params:
      - {name: host, description: 'Registry host (or a unique part of its name), or a local vessel profile such as sim.'}
      - {name: cmd, type: list, required: false, description: 'Command to run there; none opens a shell.'}
    examples:
      - astro on sim
      - astro on boat astro test list

  - name: up
    run: astro up
    summary: Start the vessel's stacks (profile astro.stacks), each on its host in the background, and wait until their ready topics publish.
    ros: ssh USER@HOST docker exec CONTAINER bash -c 'setsid -f ros2 launch PKG FILE.launch.py ARGS > LOG'; ros2 topic hz TOPIC
    notes: In order, needs first; one line per stack (up with its topic rates, or FAILED with the last log lines). A stack runs in a private tmux server (tmux -L astro) when the container has tmux, else under setsid, so an ssh drop never stops it; its log is DATA/DATE/stacks/NAME.log. Waits at most 60 s per stack.
    params:
      - {name: names, type: list, required: false, description: 'Stacks to start (none: the default ones); their needs start first.'}
      - {name: --with, description: 'An option a stack names under with: (e.g. controller), appended to its command.'}
    examples:
      - astro up
      - astro up drive --with controller
      - astro up nav

  - name: down
    run: astro down
    summary: Stop stacks in reverse order (SIGINT to the process group, then SIGTERM after 20 s); no names = all.
    ros: ssh USER@HOST docker exec CONTAINER kill -INT -- -PGID
    params:
      - {name: names, type: list, required: false, description: 'Stacks to stop; those that need them stop first.'}
    examples:
      - astro down
      - astro down drive

  - name: ps
    run: astro ps
    summary: Each stack - running or not, host, uptime, its ready topics' rates and its log path.
    ros: ssh USER@HOST docker exec CONTAINER ps -o etimes= -p PID; ros2 topic hz TOPIC

  - name: logs
    run: astro logs
    summary: The last 40 lines of a stack's log on its host; -f follows it.
    ros: ssh USER@HOST docker exec CONTAINER tail -F DATA/DATE/stacks/NAME.log
    params:
      - {name: name, description: The stack.}
      - {name: -f, type: bool, description: Follow until Ctrl-C.}
    examples:
      - astro logs drive -f

  - name: status
    run: astro status
    summary: Plain-text snapshot of the stack - nodes, the tests file's topics, recording, last log lines and the next test.
    notes: Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    ros: ros2 node list; ros2 topic echo --once TOPIC
    params:
      - {name: --watch, type: bool, description: Refresh every second until Ctrl-C.}

  - name: rec start
    run: astro rec start
    summary: Record a bag (mcap, 300 s splits) of a preset's topics into DATA/DATE/bags/HHMMSS-LABEL.
    ros: ros2 bag record -s mcap -d 300 -o DIR TOPIC... (or -a)
    notes: Presets come from the vessel profile's astro.bags file; the events topic is always recorded. Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    params:
      - {name: preset, required: false, description: A preset of the bags file (default its first).}
      - {name: label, required: false, description: Appended to the bag directory name.}
    examples:
      - astro rec start lean lake

  - name: rec stop
    run: astro rec stop
    summary: Stop the recording astro rec start began (SIGINT, so the bag closes cleanly).
    notes: Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    ros: kill -INT PID

  - name: rec ls
    run: astro rec ls
    summary: Today's bags with their start-end times and the log lines that fall inside each.
    notes: Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    ros: ros2 bag info DIR

  - name: mark
    run: astro mark
    summary: One log line, also published on the events topic (so it lands in the bag); returns at once.
    notes: Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ... (in the background with its time, ssh killed after 20 s; if that fails the mark is kept in ~/.local/state/astro/VESSEL-marks.pending, said in one line, and sent with its original time after the next forwarded command or astro sync); --here runs it here.
    ros: "ros2 topic pub --once /events std_msgs/msg/String \"{data: 'HH:MM:SS  mark  TEXT'}\""
    params:
      - {name: text, type: list, description: What happened.}
    examples:
      - astro mark wind picked up from north

  - name: log
    run: astro log
    summary: Today's log (marks, recordings, tests, applies).
    notes: Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    ros: cat DATA/DATE/log.txt
    params:
      - {name: -n, type: int, description: Only the last N lines.}

  - name: test
    run: astro test
    summary: Run one test or a group of the vessel's tests file in this terminal (Ctrl-C sends neutral); `astro test list` names them.
    ros: ros2 topic pub /EFFORT geometry_msgs/msg/Twist ... (20 Hz) while ros2 topic echo /ODOM
    notes: Each test prints its control layer, old -> new and the exact astro apply command. `astro test status` shows what is applied, measured, stale, aborted or pending, and the next step. Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; forwarded over ssh, a test keeps running if the link drops (RC is the stop); --here runs it here.
    params:
      - {name: name, description: 'list, status, a test or a group (astro test list).'}
      - {name: --space, choices: [large, small], description: The space preset (amplitudes and levels).}
      - {name: --amp, type: float, description: Override the space's amplitude.}
    examples:
      - astro test list
      - astro test status
      - astro test still

  - name: apply
    run: astro apply
    summary: Write a test result into the state file (backup first), check it, roll back on refusal, then set the live parameters.
    notes: Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    ros: ros2 param set NODE PARAM VALUE
    params:
      - {name: result, description: A test name (its latest result) or a result file.}

  - name: undo
    run: astro undo
    summary: Restore the state file from its newest backup and re-set the live parameters of that apply.
    notes: Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    ros: cp STATE.bak-STAMP STATE; ros2 param set NODE PARAM VALUE

  - name: bundle
    run: astro bundle
    summary: The state file, today's results and log (and bags) in one tgz, e.g. to replay in the sim.
    ros: tar czf bundle.tgz STATE DATA/DATE
    notes: Then prints the vessel profile's astro.bundle_next, if set, with {bundle} replaced by the file. Outside ROS (a host shell) it runs on the profile's astro.home host, as astro on HOME astro ...; --here runs it here.
    params:
      - {name: --bags, type: bool, description: Include today's bags.}

  - name: sim
    run: astro sim
    summary: Start, stop or check the simulated world of the sim vessel profile (its astro.sim backend).
    notes: The backend runs as `CMD up|down|status|check [args]` with the sim profile's environment (ROS_DOMAIN_ID, ASTRO_DATA, ASTRO_STATE); then `astro on sim` is used like a boat.
    params:
      - {name: verb, choices: [up, down, status, check], description: "What to do (check: the backend's readiness check)."}
      - {name: args, type: list, required: false, description: 'Passed to the backend untouched (e.g. --window, --headless).'}
    examples:
      - astro sim up
      - astro sim status
      - astro sim check

  - name: check
    run: astro check
    summary: Go through a field checklist (checklists/NAME.md of the field repo, astro.field) item by item; ticks save to the session's checks.yaml.
    ros: bash -c COMMAND (each check:)
    notes: 'An item that ends in check: `COMMAND` runs it (exit 0 = ok, its last line is shown); other items are manual, asked y/n on a terminal. Example item: "- [ ] sensors up - check: `astro ps`".'
    params:
      - {name: name, description: 'The checklist (e.g. lake).'}
      - {name: --list, type: bool, description: Print the items and their last state; run nothing.}
    examples:
      - astro check lake --list
      - astro check lake

  - name: issue
    run: astro issue
    summary: File a GitHub issue on the field repo with the time, vessel, current bag and the last 10 log lines; offline it is queued for astro sync.
    ros: gh issue create -R OWNER/REPO --title TEXT --body-file -
    params:
      - {name: text, description: The issue title.}
      - {name: --label, description: A label (repeat for more).}
    examples:
      - astro issue "mux ignores RC after restart" --label safety

  - name: sync
    run: astro sync
    summary: Clone or pull the field repo, copy today's log, results (without raw samples) and a bag index into the session folder, commit, push and file queued issues.
    ros: git pull; cp DATA/DATE/log.txt SESSION/; git commit; git push; gh issue create
    notes: Safe to repeat. Offline, or with astro.home not reachable, it prints one line and exits 0 (synced sessions stay). When astro.home is reached over ssh (the operator laptop) it first fetches that host's day folder - log.txt, results and a bag index (name, start-end, size), never bag data - and sends pending marks. ASTRO_FIELD_DIR overrides field.dir. The session folder is sessions/DATE-LABEL (an existing one, else the day's first rec start label, else session).
    examples:
      - astro sync

  - name: docs
    run: astro docs
    summary: Where the information lives - the field repo (clone, today's session and its plan, checklists, handoff/, plans/, issues), the day log and bags, and each repo's README.md and docs/*.md with GitHub links.
    ros: 'none: reads files only (ls; git remote get-url origin)'
    examples:
      - astro docs

  - name: show
    run: astro show
    summary: A session in plain text - its plan, check states, the log's counts (tests, applies, marks, bags) and the open issues.
    ros: cat SESSION/plan.md; gh issue list
    notes: With astro.home reached over ssh it reads the synced copy, else today's astro log on home.
    params:
      - {name: date, required: false, description: 'YYYY-MM-DD (default today).'}
    examples:
      - astro show
      - astro show 2026-11-24

  - name: astro-ros-install
    run: astro-ros-install
    summary: Install a ROS or apt package into this running container by distro-independent name.
    notes: >-
      ROS names resolve to ros-$ROS_DISTRO-* debs, else build from source into /opt/astro-extra.
      The shell reloads after it. Installs last until the container is recreated; each is recorded
      in .devcontainer/installed.local.txt: move the names to packages.txt (jetson-packages.txt on
      Jetson, requirements.txt for pip) to keep them.
    params:
      - name: --source
        type: bool
        description: Build ROS packages from source even when a deb exists.
      - name: names
        type: list
        description: Package names, e.g. nav2_bringup, htop, or pip:SPEC for /workspace/venv.
    examples:
      - astro-ros-install nav2_bringup
      - astro-ros-install --source examples_rclcpp_minimal_publisher

  - name: colcon build
    run: colcon build
    summary: Build the workspace; the shell reloads the new install/ when it succeeds.
    params:
      - name: --packages-up-to
        type: list
        description: Build these packages and their dependencies only.
      - name: --packages-select
        type: list
        description: Build exactly these packages.
      - name: --symlink-install
        type: bool
        description: Symlink Python and data files so edits apply without a rebuild.
    examples:
      - colcon build --packages-up-to my_package

  - name: ros_env
    run: ros_env
    summary: Reload ROS, the image overlays and the workspace install/ in this shell.

  - name: ros_net
    run: ros_net
    summary: Re-detect this host's robot-subnet address and pin DDS to it (each new shell does this).
    notes: Set ASTRO_DDS_ADDRESS to force an address; off the robot subnet DDS uses all interfaces.
    params:
      - name: -v
        type: bool
        description: Print the choice.

  - name: rviz2
    run: rviz2
    summary: RViz with the workspace dark theme, pinned to the robot network interface.

  - name: setup.linux.sh
    run: ./setup.linux.sh
    summary: Prepare a Linux host for the containers, stage by stage (run on the host, not in a container).
    notes: Each stage explains itself and asks first; reruns are safe.
    params:
      - name: --components
        default: clock,docker,gpu,devices,devtools,compose
        description: Comma-separated stages (also deps, mdns, repos, gateway, boat, jetson, operator-key), e.g. clock,docker.
      - name: --dry-run
        type: bool
        description: Print the commands without running them.
      - name: --yes
        type: bool
        description: Approve the plan and every stage.
      - name: --non-interactive
        type: bool
        description: No prompts (needs --yes).
      - name: --vessel
        description: The vessel profile (default this machine's, as hw.sh whoami finds it).
      - name: --host
        description: This machine's registry host, or any other name for a generic control station.
      - name: --role
        type: list
        description: Repos stage roles whose repositories to add to repos.all (default this host's roles).
    examples:
      - ./setup.linux.sh --components clock --dry-run
      - ./setup.linux.sh --components repos --role operator
      - ./setup.linux.sh --components mdns

  # hw.sh verbs (machine, network and deploy): astro VERB runs $ROS_WS/hw.sh VERB; hw.sh stays usable directly.
  - name: whoami
    run: $ROS_WS/hw.sh whoami
    summary: This machine's host and vessel, and how they were found.
    params:
      - {name: --root, type: bool, description: Print the profile root instead.}
      - {name: --registry, type: bool, description: Print the host registry path instead.}
  - name: env
    run: $ROS_WS/hw.sh env
    summary: The vessel's network env path, or one key or role address (<ROLE>_IP).
    params:
      - {name: key, required: false, description: 'A key such as ROUTER_IP.'}
  - name: profile show
    run: $ROS_WS/hw.sh profile show
    summary: A merged vessel profile (no secrets).
    params:
      - {name: name, required: false, description: Profile name (default this vessel).}
  - name: profile sync
    run: $ROS_WS/hw.sh profile sync
    summary: Check out your profile set at its recorded ref (URL REF records new ones first).
  - name: secrets check
    run: $ROS_WS/hw.sh secrets check
    summary: The secrets file and the missing key names (never values).
  - name: hot
    run: $ROS_WS/hw.sh hot
    summary: Push src/REPO's working tree (uncommitted too) to the robot hosts that run it and build it there, LAN only.
    params:
      - {name: repo, description: A repository under src/.}
      - {name: --host, required: false, description: Only this host.}
      - {name: --dry-run, type: bool, description: Show hosts, files and build plan; send nothing.}
    examples:
      - astro hot REPO --dry-run
  - name: station take
    run: $ROS_WS/hw.sh station take
    summary: Make this computer the operator station (robot link, gateway and time roles, keys, station file).
    params:
      - {name: --dry-run, type: bool, description: Show the steps; change nothing.}
  - name: station release
    run: $ROS_WS/hw.sh station release
    summary: Stop this computer's operator station services.
  - name: overlay
    run: $ROS_WS/hw.sh overlay
    summary: Colcon-build a worktree's changed packages as an overlay on the workspace install; prints the source line.
    params:
      - {name: path, description: The worktree.}
      - {name: --base, required: false, description: 'Compare against this ref (default origin/main).'}
  - name: pyenv
    run: $ROS_WS/hw.sh pyenv
    summary: The PYTHONPATH that runs a worktree's pure-Python packages from source, no colcon.
    params:
      - {name: path, description: The worktree.}
  - name: build
    run: $ROS_WS/hw.sh build
    summary: The workspace's colcon build in its dev container (from clean when the image or colcon defaults changed).
  - name: image
    run: $ROS_WS/hw.sh image
    summary: The dev image the Compose config names.
    params:
      - {name: --pull, type: bool, description: Pull when the registry has a newer one.}
      - {name: --local, type: bool, description: The local image built on it.}
  - name: device
    run: $ROS_WS/hw.sh
    summary: One device kind's verb (status, plan, apply, verify, rollback) for the kinds the vessel profile names.
    notes: >-
      The kinds come from the vessel profile (hw.sh with no arguments lists them). Profiles are yours:
      ~/.config/astro/profiles.env names ASTRO_PROFILES or ASTRO_PROFILES_URL at ASTRO_PROFILES_REF.
      Secrets live in ~/.config/astro/secrets.env (mode 600). --vessel and --host override detection.
    params:
      - {name: kind, description: A device kind of the vessel profile.}
      - {name: verb, description: 'status, plan, apply, verify or rollback (KIND VERB --help for details).'}
    examples:
      - astro device hosts status
      - astro device radio verify

  - name: net/share.sh
    run: $ROS_WS/net/share.sh
    summary: Create a Samba network folder (interactive; run on the host). Its HOST.local name comes from setup.linux.sh --components mdns.
    notes: Asks for the share name, user and password; mounts it at /mnt/NAME and keeps the login in ~/.smbcredentials.

  - name: net/mesh.sh
    run: $ROS_WS/net/mesh.sh
    summary: Join a WARP mesh with the code its owner sent, leave it, or own one on your Cloudflare account (run on the host).
    notes: join and leave need only curl and sh; setup, invite, devices, revoke and teardown run cx mesh, or cx's standalone util without cx.

  - name: fetch_bags.sh
    run: $ROS_WS/fetch_bags.sh
    summary: Copy a host's session bags into bags/NAME (reads the remote only; rsync, else tar over ssh).
    params:
      - name: source
        description: HOST:REMOTE_DIR, e.g. jetson:~/astro_dock/bags/SESSION.
      - name: name
        description: The directory under bags/ to copy into.

  - name: astro-clock.py
    run: $ROS_WS/.devcontainer/astro-clock.py
    summary: Clock offset of each LAN host by one SNTP query (default the time_server role and the STATIC_LEASES hosts).
    notes: Exits 1 when a host is more than 50 ms off, unsynchronised or silent.
    params:
      - name: hosts
        type: list
        required: false
        description: Hosts to ask instead of the vessel's network env.
