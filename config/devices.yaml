# Which computer has which role on the boat (the deployment layer of the device registry).
# mhseals_testing reads it over its package layer; ~/.config/mhseals/devices.yaml may add `self:`.
# Addresses are never written here: `$KEY` reads config/boat-network.env, and a host without an
# address takes its STATIC_LEASES reservation (joined on the host name). What each role runs is
# mhseals_nav's config/devices/<profile>.yaml.
defaults: {user: roboboat, container: roboboat_dev, workspace: ~/astro_dock, ssh: true}
roles:
  boat_computer: {profile: odroid}
  camera_host: {profile: jetson}
  operator: {profile: operator}      # RTK base and the operator heartbeat run here
hosts:
  blastoise-odroid: {roles: [boat_computer], capabilities: [mavros, thrusters]}
  blastoise-jetson: {roles: [camera_host], capabilities: [gpu, zed, lidar]}
  tranquility: {roles: [operator, gateway], user: peace, address: $GATEWAY_IP}
  router: {roles: [router], address: $ROUTER_IP, ssh: false}
  rocket: {roles: [radio], address: $UBNT_ROCKET_IP, ssh: false}
  bullet: {roles: [radio], address: $UBNT_BULLET_IP, ssh: false}
  vlp16: {roles: [lidar_sensor], address: $LIDAR_IP, ssh: false}
ping: [camera_host, boat_computer, router, radio, lidar_sensor]   # this machine is skipped
