# Velodyne VLP16 over its HTTP API. mhseals_nav's lidar.yaml rpm must match rpm here.
driver: lidar/vlp16
address: $LIDAR_IP              # checked, never posted
mac: 60:76:88:38:35:85
netmask: $LIDAR_NETMASK
gateway: $LIDAR_GATEWAY
data_host: $LIDAR_DATA_HOST
data_port: 2368
telemetry_port: 8308
rpm: 600                        # 300-1200 in steps of 60
returns: Strongest              # Strongest, Last or Dual (Dual doubles the packet rate)
fov: {start: 0, end: 359}
jump: LIDAR_JUMP                # .env key of an optional ssh host on the LAN
