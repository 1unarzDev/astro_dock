# Velodyne VLP16 over its HTTP API, on the boat's network env. mhseals_nav's lidar.yaml rpm must match rpm here.
driver: lidar/vlp16
address: $LIDAR_IP              # checked, never posted
mac:                            # the boat's sensor
netmask: $NETMASK
gateway: $ROUTER_IP
data_host: $LIDAR_DATA_HOST
data_port: 2368
telemetry_port: 8308
rpm: 600                        # 300-1200 in steps of 60
returns: Strongest              # Strongest, Last or Dual (Dual doubles the packet rate)
fov: {start: 0, end: 359}
jump: LIDAR_JUMP                # secrets key of an optional ssh host on the LAN
