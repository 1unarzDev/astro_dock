# Ubiquiti airMAX point-to-point link: both radios bridge onto the boat LAN. The WPA key stays on
# the radios and in snapshots under ~/.local/state/astro_dock/ubiquiti.
driver: radio/airmax
ssid:                           # the boat's link
revert_seconds: 300             # a RAM trial reboots into the saved config unless KEEP is typed
devices: {}                     # the boat's two radios: NAME: {address, mac, role: ap|station, cfg: airOS key=value pairs `apply NAME` sets}
reachable: [$ROUTER_IP, $BOAT_TRANSPORT_IP]   # verify pings these across the link
credentials: {user: UBNT_USER, password: UBNT_PASSWORD, jump: UBNT_JUMP}
measure:                        # iperf3 + ping against the boat computer
  target: $BOAT_TRANSPORT_IP
  container: roboboat_dev       # iperf3 from this container when a host lacks it
  seconds: 10
  port: 5201
  credentials: {user: BOAT_HOST_USER, password: BOAT_HOST_PASSWORD}
propose:                        # guards for `propose`; empty = keep the radio's value
  range_m: 1000                 # farthest link distance
  freq: ""                      # MHz, from a site survey
  width_max: 40
  txpower_max: ""               # dBm; without it power only goes down
