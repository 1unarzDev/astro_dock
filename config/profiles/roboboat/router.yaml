# DD-WRT router: DHCP, DNS and WPA2 Wi-Fi on the boat LAN. Router WAN/NAT are off; the gateway
# host forwards internet, so clients get it as their default gateway.
driver: router/ddwrt
name: mhseals                   # router name, Wi-Fi SSID and web-admin user
time_zone: America/Chicago
lan: {address: $ROUTER_IP, netmask: $NETMASK, gateway: $GATEWAY_IP}
dns: [$DNS_PRIMARY, $DNS_SECONDARY]
dhcp: {start: $DHCP_START, count: $DHCP_COUNT, lease_minutes: 1440, reservations: $STATIC_LEASES}
revert_seconds: 300             # an unconfirmed apply restores the previous NVRAM this long after boot
credentials:                    # secrets keys (secrets.keys)
  user: ROUTER_USER             # ssh login, root on DD-WRT
  password: ROUTER_PASSWORD     # ssh password, only until the router key is installed
  admin_password: ROUTER_ADMIN_PASSWORD
  wifi_password: BOAT_WIFI_PASSWORD
