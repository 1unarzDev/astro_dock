# The boat computers of the registry (every host with ssh on): deploy, keys, and the repositories under
# src/ that each one checks out (the image bakes none of them).
driver: hosts/fleet
repos:                          # per registry role, plus all: a host checks out all and its roles' repos
  all: [mhseals_hardware, mhseals_nav, mhseals_testing]   # apply fast-forwards them; setup's repos stage clones and builds them
  boat_computer: []
  camera_host: [direct_lidar_inertial_odometry]           # the lidar host
  operator: [rviz-plugin-zed-od, zed-ros2-wrapper]        # ZED messages for RViz
  gateway: []
sources:                        # src/NAME: clone URL, branch (default main); repos picks from these
  mhseals_hardware: {url: https://github.com/MHSeals/mhseals_hardware.git}
  mhseals_nav: {url: https://github.com/MHSeals/mhseals_nav.git}
  mhseals_testing: {url: https://github.com/MHSeals/mhseals_testing.git}
  direct_lidar_inertial_odometry:   # optional DLIO odometry of mhseals_nav's odom.launch.py
    {url: https://github.com/vectr-ucla/direct_lidar_inertial_odometry.git, branch: feature/ros2}
  rviz-plugin-zed-od: {url: https://github.com/mhseals/rviz-plugin-zed-od.git}
  zed-ros2-wrapper: {url: https://github.com/stereolabs/zed-ros2-wrapper.git, branch: master}   # the Jetson image bakes its own
compose_project: astro_dock_devcontainer
operator_key: mhseals/ssh       # under XDG_CONFIG_HOME: the key and known_hosts the testing TUI uses
operator_registry: mhseals/devices.yaml   # under XDG_CONFIG_HOME: this computer's `self:` for keys
